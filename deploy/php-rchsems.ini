upload_max_filesize = 15M
post_max_size = 20M
memory_limit = 256M
max_execution_time = 120
expose_php = Off

; Hardening for the PHP security advisory of 21 October 2026 (CVE-2026-109618 and CVE-2026-109619).
; Updating PHP is the real fix; these settings only reduce exposure. The application does not use
; session upload progress, and fatal_error_backtraces only exists on PHP 8.5 (older versions ignore it).
; Do not set memory_limit=-1: it trades the advisory's attack path for an availability risk.
session.upload_progress.enabled = 0
fatal_error_backtraces = 0
